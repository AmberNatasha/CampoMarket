<!doctype html>
<html lang="es">
<body style="margin:0;background:#f3f6f1;font-family:Arial,Helvetica,sans-serif;color:#243127;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f3f6f1;padding:32px 12px;">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:620px;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(29,69,43,.10);">
                    <tr>
                        <td align="center" style="background:#edf6ec;padding:24px;">
                            <img src="cid:campomarket-logo" alt="Campo Market" width="145" style="display:block;max-width:145px;height:auto;">
                        </td>
                    </tr>

                    <tr>
                        <td style="padding:32px 38px;">
                            <h1 style="margin:0 0 22px;font-size:24px;color:#205b32;">
                                Nueva consulta
                            </h1>

                            <table role="presentation" width="100%" cellspacing="0" cellpadding="6" style="font-size:15px;line-height:1.5;">
                                <tr>
                                    <td style="font-weight:bold;width:90px;">Nombre:</td>
                                    <td>{{Nombre}}</td>
                                </tr>
                                <tr>
                                    <td style="font-weight:bold;">Correo:</td>
                                    <td>
                                        <a href="mailto:{{Correo}}" style="color:#2f7d43;">
                                            {{Correo}}
                                        </a>
                                    </td>
                                </tr>
                                <tr>
                                    <td style="font-weight:bold;">Teléfono:</td>
                                    <td>{{Telefono}}</td>
                                </tr>
                            </table>

                            <div style="margin-top:22px;padding:18px;background:#f7faf6;border-left:4px solid #2f7d43;border-radius:6px;font-size:15px;line-height:1.65;">
                                {{Mensaje}}
                            </div>

                            <p style="margin:22px 0 0;font-size:13px;color:#718075;">
                                Responde este correo para contestarle directamente al visitante.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
